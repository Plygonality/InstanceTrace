[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instancetrace"
version = "0.1.0"
description = "Provenance tracer for procedurally generated geometry and instances."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Plygonality"}]
keywords = ["blender", "geometry-nodes", "provenance", "procedural"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
instancetrace = "instancetrace.cli.main:main"

[project.urls]
Homepage = "https://github.com/Plygonality/InstanceTrace"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
instancetrace = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]
"blender_addon/**" = ["E402"]
